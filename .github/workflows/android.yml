name: Widget Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', 'scripts/android/**']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml', 'scripts/android/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/meteo.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/meteo.keystore" >> "$GITHUB_ENV"
          else
            echo "Clé du dépôt utilisée (android/app/meteo.keystore)."
          fi

      - name: Compiler l'APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk meteo-widget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: meteo-widget
          path: meteo-widget.apk

      # Essai réel sur un émulateur Android : l'appli s'ouvre, les alertes tournent, aucun plantage.
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Essai sur émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/android/smoke.sh meteo-widget.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulateur
          path: |
            screen.png
            crash.txt
            errors.txt
          if-no-files-found: ignore

      - name: Publier la version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="widget-v${{ github.run_number }}"
          gh release create "$tag" meteo-widget.apk --title "Widget Android v${{ github.run_number }}" \
            --notes "Installez meteo-widget.apk sur le téléphone, puis ajoutez le widget « Météo fiable » à l'écran d'accueil." --latest
